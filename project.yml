# XcodeGen manifest — the .xcodeproj is generated from this file on the CI runner.
# Never commit an .xcodeproj. See docs/12-CICD-NO-MAC.md.
#
# Regenerate locally (macOS only):  xcodegen generate
# On CI this runs automatically in the fastlane `before_all` hook.

name: Amblyo

options:
  bundleIdPrefix: com.amblyo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    DEVELOPMENT_TEAM: QAT93YWVSF
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:

  Amblyo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: Amblyo
        PRODUCT_BUNDLE_IDENTIFIER: com.amblyo.app
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"          # 1 = iPhone, 2 = iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandPrimary
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
    entitlements:
      path: App/Amblyo.entitlements
      properties:
        com.apple.developer.healthkit: false      # flip to true in v1.1

  AmblyoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amblyo.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Amblyo

  AmblyoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amblyo.app.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Amblyo

schemes:

  Amblyo:
    build:
      targets:
        Amblyo: all
        AmblyoTests: [test]
        AmblyoUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-uitest-seed-demo-data": false
        "-uitest-unlock-pro": false
      storeKitConfiguration: Amblyo.storekit
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [Amblyo]
      targets:
        - AmblyoTests
        - AmblyoUITests
    archive:
      config: Release
