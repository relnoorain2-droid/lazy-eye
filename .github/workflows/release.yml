name: Release to TestFlight

# Two ways to trigger, both one action:
#   1. Push a version tag:  git tag v1.0.0 && git push origin v1.0.0
#   2. Actions tab -> Release to TestFlight -> Run workflow  (no git needed)
#
# SIGNING: Xcode automatic signing, driven by the App Store Connect API key.
# There is no fastlane match, no certificates repo, no PAT, no passphrase.
# xcodebuild asks Apple for the certificate and profile it needs, and creates
# them if they are missing. See the Fastfile `beta` lane for why.
#
# Only THREE secrets are required now:
#   ASC_KEY_ID  ASC_ISSUER_ID  ASC_KEY_P8
# MATCH_PASSWORD, MATCH_GIT_URL and MATCH_GIT_AUTH are no longer used and can
# be deleted from the repository settings.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Re-run the full test suite first (slow; CI already tested this commit)'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compliance lint
        run: python3 scripts/lint_claims.py

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # xcodebuild's -authenticationKeyPath needs a real file on disk, not an
      # environment variable. Written to the runner only; it dies with the VM.
      - name: Write App Store Connect API key to disk
        run: |
          set -euo pipefail

          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_KEY_P8}" ]; then
            echo "::error::One of ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 is empty."
            exit 1
          fi

          KEY_DIR="${HOME}/private_keys"
          mkdir -p "${KEY_DIR}"
          KEY_FILE="${KEY_DIR}/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "${ASC_KEY_P8}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          # A truncated paste is the classic failure here, and it surfaces much
          # later as an opaque authentication error. Catch it now.
          if ! grep -q 'BEGIN PRIVATE KEY' "${KEY_FILE}"; then
            echo "::error::ASC_KEY_P8 does not contain a private key. Paste the WHOLE .p8 file, including the BEGIN and END lines."
            exit 1
          fi

          echo "ASC_KEY_FILE=${KEY_FILE}" >> "$GITHUB_ENV"
          echo "API key written ($(wc -l < "${KEY_FILE}") lines)."

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      # Off by default: ci.yml already tested this commit on every push to main.
      # Re-running cost ~15 minutes of macOS quota per release attempt.
      - name: Run tests before shipping (optional)
        if: ${{ inputs.run_tests == true }}
        run: bundle exec fastlane ci

      - name: Archive and upload to TestFlight
        run: bundle exec fastlane beta

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/*.ipa
            build/*.app.dSYM.zip
          retention-days: 14
          if-no-files-found: ignore
