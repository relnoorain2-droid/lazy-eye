name: CI

# Runs on every push to main/develop and every PR.
#
# Note the ordering: the cheap checks run first. Claims lint takes two seconds
# and catches the mistake that costs a week of App Review turnaround, so it
# gates everything else.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Runs on Linux — free minutes, no macOS multiplier.
  lint:
    name: Compliance lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Banned medical-claim language
        run: python3 scripts/lint_claims.py

      - name: Colour tokens match the asset catalog
        run: |
          python3 scripts/make_colorsets.py
          if ! git diff --quiet App/Resources/Assets.xcassets; then
            echo "::error::Asset catalog is out of date. Run scripts/make_colorsets.py and commit."
            git diff --stat App/Resources/Assets.xcassets
            exit 1
          fi

      # Ten milliseconds here instead of a five-minute macOS build plus the wait
      # for Apple to answer. This is the check that would have caught the
      # build-8 rejection. See scripts/check_app_icon.py.
      - name: App icon meets Apple's upload rules
        run: python3 scripts/check_app_icon.py

      # Duplicate declarations, type-name clashes and members called on the
      # wrong type. Three CI rounds have now been spent on exactly these, each
      # costing four minutes of macOS time at the 10x rate to learn something a
      # second of Python on a free runner can tell us. See scripts/check_symbols.py.
      - name: SwiftData predicates Core Data can actually translate
        run: python3 scripts/check_predicates.py

      - name: No duplicate or misplaced symbols
        run: python3 scripts/check_symbols.py

      - name: Legal documents are present
        run: |
          for doc in medical-disclaimer privacy-policy subscription-terms evidence-and-methods; do
            test -f "App/Resources/Legal/$doc.md" \
              || { echo "::error::Missing App/Resources/Legal/$doc.md"; exit 1; }
          done

  build:
    name: Build and test
    needs: lint
    runs-on: macos-15
    timeout-minutes: 45

    env:
      # One simulator on an ordinary push; both when the workflow is started by
      # hand. macOS minutes bill at 10x, so a second simulator doubles the cost
      # of every iteration during a phase of active development. Run the full
      # matrix deliberately - before a release, or when touching layout - rather
      # than on every commit. See the Fastfile for the reasoning.
      TEST_DEVICES: >-
        ${{ github.event_name == 'workflow_dispatch'
            && 'iPhone 16,iPad Pro 13-inch (M4)'
            || 'iPhone 16' }}

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: bundle exec fastlane ci

      # PRINT THE CRASH REPORT INTO THE LOG, NOT JUST INTO AN ARTIFACT.
      #
      # Six CI runs were spent on a UI test failure whose real cause was the app
      # terminating at launch. The crash report existed the whole time, inside
      # the .xcresult artifact — which nobody working from the log can open. An
      # artifact that has to be downloaded to be read is not a diagnostic during
      # a debugging loop; it is a diagnostic after one.
      #
      # `head` rather than the whole file: the exception type, the termination
      # reason and the first frames are what identify a crash, and the rest is
      # thread dumps nobody reads.
      - name: Print simulator crash reports
        if: failure()
        run: |
          set +e
          echo "=== Crash reports for Amblyo ==="
          found=0
          for dir in ~/Library/Logs/DiagnosticReports \
                     ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/DiagnosticReports; do
            for file in "$dir"/Amblyo*; do
              [ -e "$file" ] || continue
              found=1
              echo "----- $file -----"
              # PARSED, NOT TRUNCATED. The previous version printed the first
              # 6000 bytes, which is the header — the reason string an uncaught
              # NSException carries sits in `asi`, further down, so the one
              # field that names the bug was the one field cut off.
              python3 - "$file" <<'PY'
          import json, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          # An .ips is one JSON header line followed by the payload object.
          parts = raw.split("\n", 1)
          try:
              payload = json.loads(parts[1])
          except Exception:
              print(raw[:3000]); sys.exit()
          print("exception :", payload.get("exception"))
          print("termination:", payload.get("termination"))
          asi = payload.get("asi") or {}
          for lib, messages in asi.items():
              for m in messages:
                  print("REASON [%s]: %s" % (lib, m))
          for note in payload.get("notes", []) or []:
              print("note:", note)
          faulting = payload.get("faultingThread", 0)
          threads = payload.get("threads", [])
          if faulting < len(threads):
              print("--- faulting thread %d ---" % faulting)
              for frame in threads[faulting].get("frames", [])[:30]:
                  print("   ", frame.get("symbol", frame.get("imageOffset")))
          PY
              echo
            done
          done
          [ "$found" -eq 0 ] && echo "No crash report found — the app may have been killed rather than crashing."
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            fastlane/test_output
          retention-days: 7
          if-no-files-found: ignore
