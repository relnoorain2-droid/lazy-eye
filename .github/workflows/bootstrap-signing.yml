name: Bootstrap Signing (run once)

# ONE-TIME SETUP. Run this manually from the Actions tab before the first
# TestFlight upload, and then never again.
#
# It creates your Apple distribution certificate and provisioning profiles and
# commits them, encrypted, to your private certificates repo. From then on every
# release build just decrypts them.
#
# You cannot run `fastlane match` on Windows, which is exactly why this workflow
# exists — the runner does it for you.
#
# ⚠️ Apple limits you to a small number of distribution certificates. Re-running
# this with force enabled can revoke a certificate that TestFlight builds already
# depend on. If you think you need to run it twice, read
# docs/12-CICD-NO-MAC.md section 6 first.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BOOTSTRAP to confirm you want to create certificates'
        required: true
        default: ''

jobs:
  bootstrap:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check confirmation
        if: ${{ github.event.inputs.confirm != 'BOOTSTRAP' }}
        run: |
          echo "::error::Type BOOTSTRAP in the confirmation field to proceed."
          exit 1

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Create certificates and profiles
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_AUTH }}
        run: bundle exec fastlane bootstrap

      - name: Done
        run: |
          echo "Certificates created and stored in the match repo."
          echo "You should not need to run this workflow again."
